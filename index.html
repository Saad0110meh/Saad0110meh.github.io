<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>sleepyhead // portfolio</title>

<!-- Retro typography -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ============================================================
       LAYER 1: BOOT PROMPT
       Black screen shown first. Browsers block autoplay w/ sound
       until a user gesture, so we wait for a click/keypress before
       touching the <video> element at all.
  ============================================================= -->
  <section id="boot-prompt" class="screen">
    <p class="blink-text">[ Click or Press Any Key to Boot ]</p>
  </section>

  <!-- ============================================================
       LAYER 2: PS2 BOOT VIDEO
       Swap the src below for your own file. Video is muted=false by
       default -- browsers allow audio here because this element is
       only played AFTER the user gesture above.
  ============================================================= -->
  <section id="boot-video-wrap" class="screen hidden">
    <video id="boot-video" playsinline>
      <!-- PLUG IN YOUR ASSET: replace with your PS2 boot mp4 -->
      <source src="assets/Playstation 2 Startup Intro (PS2).mp4" type="video/mp4" />
    </video>
    <p id="skip-intro-hint" class="skip-hint">Press ESC to Skip</p>
  </section>

  <!-- ============================================================
       LAYER 3: GAME (Stardew-style room)
       Canvas is drawn at a fixed internal resolution then scaled
       via CSS for crisp pixel art (see style.css image-rendering).
  ============================================================= -->
  <section id="game-wrap" class="screen hidden">
    <canvas id="game-canvas"></canvas>

    <!-- Floating "Press E to Interact" prompt, positioned in JS -->
    <div id="interact-prompt" class="interact-prompt hidden">Press E to Interact</div>

    <!-- Small HUD, purely decorative but useful while testing -->
    <div id="hud">
      <span id="hud-fps"></span>
    </div>
  </section>

  <!-- ============================================================
       LAYER 4: PS2 MEMORY CARD MODAL SYSTEM
       One shared shell, content swapped per-panel via data-panel.
       Only one of [data-panel] children is shown at a time (JS
       toggles the "active" class based on which object was used).
  ============================================================= -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="memcard-window">

      <!-- Title bar -->
      <div class="memcard-titlebar">
        <span id="memcard-title">MEMORY CARD</span>
      </div>

      <div class="memcard-body">

        <!-- ---------- PROJECTS PANEL (Desk) ---------- -->
        <div class="memcard-panel" data-panel="projects">
          <ul class="memcard-list" id="projects-list">
            <!-- PLUG IN YOUR CONTENT: items are generated from
                 the PROJECTS array in main.js -->
          </ul>
          <div class="memcard-detail" id="projects-detail">
            <p class="placeholder-text">Select a project to view details.</p>
          </div>
        </div>

        <!-- ---------- BIO / SKILLS PANEL (Bookshelf) ---------- -->
        <div class="memcard-panel" data-panel="bio">
          <div class="bio-columns">
            <div class="bio-portrait">
              <!-- PLUG IN YOUR ASSET: portrait / avatar image -->
              <div class="portrait-placeholder">IMG</div>
            </div>
            <div class="bio-text">
              <h3>sleepyhead</h3>
              <p id="bio-copy">
                Loaded from BIO_TEXT in main.js — replace with your own bio.
              </p>
              <h4>Skills</h4>
              <ul class="skill-tags" id="skills-list"></ul>
            </div>
          </div>
        </div>

        <!-- ---------- ACHIEVEMENTS PANEL (Trophy Case) ---------- -->
        <div class="memcard-panel" data-panel="achievements">
          <ul class="memcard-list" id="achievements-list">
            <!-- Populated dynamically from localStorage in main.js -->
          </ul>
        </div>

      </div>

      <!-- Button hint bar, PS2-style -->
      <div class="memcard-footer">
        <span class="btn-hint"><span class="btn-x">X</span> Select</span>
        <span class="btn-hint"><span class="btn-o">O</span> Close</span>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
